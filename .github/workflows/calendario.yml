name: Calendario
on:
  schedule:
    # Cada hora, unos minutos después de que publique el vigilante (lo hace hacia el minuto 20–45).
    - cron: '50 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  calendario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Datos publicados anteriores
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: publicado
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # El calendario lo hace el vigilante (Cloudflare); si falla o no cuadra, el de siempre como respaldo.
      - run: node src/desde-vigilante.mjs publicado || node src/calendario.mjs publicado
      - run: ./publicar.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
