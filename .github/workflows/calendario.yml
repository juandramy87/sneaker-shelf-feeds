name: Calendario
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  calendario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Datos publicados anteriores
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: publicado
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/calendario.mjs publicado
      - run: ./publicar.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
